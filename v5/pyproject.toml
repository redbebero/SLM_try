[project]
name = "slm-v5-spell-ai"
version = "0.1.0"
description = "AI-only Korean incantation proposal model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "jsonschema>=4,<5",
  "torch==2.7.1+cpu"
]

[dependency-groups]
dev = [
  "pytest>=8,<9"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
